name: CI
on:
  pull_request:
  push:
    branches:
      - master
      - main
  schedule:
    - cron: '0 9 1 * *'

jobs:
  koans:
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '2.0'
          - '2.1'
          - '2.2'
          - '2.3'
          - '2.4'
          - '2.5'
          - '2.6'
          - '2.7'
          - '3.0'
          - '3.1'
          - '3.2'
          - '3.3'
          - '3.4'
          - '4.0'
          - ruby-head
        os: [ubuntu-latest]
        include:
          - ruby: '1.9'
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Ruby!
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - name: Run solved koans
        run: rake run

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Ruby!
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'

      - name: run tests
        run: rake test
